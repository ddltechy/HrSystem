<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="16" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#111">Sequence diagram (placeholder) — AbsenceService manager → HR saga</text>
  <g font-family="Courier New, monospace" font-size="12" fill="#333">
    <text x="16" y="56">Employee -> Gateway: POST /api/absences</text>
    <text x="16" y="76">Gateway -> AbsenceService: CreateLeaveRequest</text>
    <text x="16" y="96">AbsenceService -> EmployeeService: GET /api/employees/{id}/status</text>
    <text x="16" y="116">AbsenceService: PlaceHold (DB) & Publish LeaveHoldPlaced</text>
    <text x="16" y="136">Manager -> Gateway: POST /api/absences/{id}/manager-approve</text>
    <text x="16" y="156">HR -> Gateway: POST /api/absences/{id}/hr-approve</text>
    <text x="16" y="176">AbsenceService: Finalize (hold -> deduct) & Publish LeaveFinalized</text>
    <text x="16" y="196">AttendanceService consumes LeaveFinalized → mark days OnLeave</text>
  </g>
</svg>